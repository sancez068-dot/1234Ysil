name: Build ToiletLocker EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name ToiletLocker `
            --icon "resources/111.ico" `
            --add-data "resources;resources" `
            main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ToiletLocker
          path: dist/ToiletLocker.exe
